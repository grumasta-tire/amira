<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jadwal Les</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="login" hidden>
  <h1>Jadwal Les</h1>
  <form id="lf">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <p id="lerr" class="err" role="alert"></p>
    <button class="pri">Masuk</button>
  </form>
</main>

<div id="app" hidden>
  <header>
    <div><b>Jadwal Les</b><small id="who"></small></div>
    <button id="out">Keluar</button>
  </header>
  <nav style="max-width:688px;margin:1rem auto 0" class="tabs" id="nav"><button data-v="sesi" aria-pressed="true">Sesi</button><button data-v="siswa" id="nav-siswa" aria-pressed="false" hidden>Siswa</button></nav>
  <div class="wrap">
   <section id="v-sesi">
    <div class="tabs" id="tabs">
      <button data-f="today" aria-pressed="false">Hari ini</button>
      <button data-f="week" aria-pressed="true">Minggu ini</button>
      <button data-f="month" aria-pressed="false">Bulan ini</button>
    </div>
    <div id="list"></div>
   </section>
   <section id="v-siswa" hidden>
    <div class="bar"><h2 style="margin:0">Daftar siswa</h2><button class="pri" id="sadd">Tambah siswa</button></div>
    <div id="slist"></div>
   </section>
  </div>
</div>

<dialog id="dlg">
  <form id="f">
    <h3 id="dname"></h3>
    <label for="dt">Tanggal</label><input id="dt" type="date" required>
    <div class="two">
      <div><label for="st">Mulai</label><input id="st" type="time"></div>
      <div><label for="en">Selesai</label><input id="en" type="time"></div>
    </div>
    <label for="sts">Status</label>
    <select id="sts"><option value="terjadwal">Terjadwal</option><option value="batal">Batal</option><option value="pindah">Pindah</option></select>
    <label for="nt">Catatan</label><input id="nt">
    <label class="chk" id="futl"><input type="checkbox" id="fut">Terapkan jam ini ke sesi berikutnya</label>
    <p id="derr" class="err" role="alert"></p>
    <div class="act"><button type="button" id="cancel">Batal</button><button class="pri">Simpan</button></div>
  </form>
</dialog>

<dialog id="sdlg">
  <form id="sform">
    <h3 id="sd-title"></h3>
    <label for="sn">Nama</label><input id="sn" required>
    <label for="sc">Kontak</label><input id="sc">
    <label for="sg">Kelas</label><input id="sg">
    <label for="sf">Biaya bulanan (Rp)</label><input id="sf" type="number" min="0" step="1000" inputmode="numeric">
    <label for="sx">Catatan</label><input id="sx">
    <label class="chk"><input type="checkbox" id="sa">Siswa aktif (sesi dibuat otomatis)</label>
    <p id="serr" class="err" role="alert"></p>
    <div class="act"><button type="button" id="scancel">Batal</button><button class="pri">Simpan</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/sessions.js"></script>
<script src="js/students.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
