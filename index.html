<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jadwal Les</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="login" hidden>
  <h1>Jadwal Les</h1>
  <form id="lf">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <p id="lerr" class="err" role="alert"></p>
    <button class="pri">Masuk</button>
  </form>
</main>

<div id="app" hidden>
  <header>
    <div><b>Jadwal Les</b><small id="who"></small></div>
    <button id="out">Keluar</button>
  </header>
  <nav style="max-width:688px;margin:1rem auto 0" class="tabs" id="nav"><button data-v="sesi" aria-pressed="true">Sesi</button><button data-v="siswa" id="nav-siswa" aria-pressed="false" hidden>Siswa</button><button data-v="jadwal" id="nav-jadwal" aria-pressed="false" hidden>Jadwal</button><button data-v="bayar" id="nav-bayar" aria-pressed="false" hidden>Bayar</button><button data-v="laporan" id="nav-laporan" aria-pressed="false" hidden>Laporan</button></nav>
  <div class="wrap">
   <section id="v-sesi">
    <div class="tabs" id="tabs">
      <button data-f="today" aria-pressed="false">Hari ini</button>
      <button data-f="week" aria-pressed="true">Minggu ini</button>
      <button data-f="month" aria-pressed="false">Bulan ini</button>
    </div>
    <div id="list"></div>
   </section>
   <section id="v-siswa" hidden>
    <div class="bar"><h2 style="margin:0">Daftar siswa</h2><button class="pri" id="sadd">Tambah siswa</button></div>
    <div id="slist"></div>
   </section>
   <section id="v-jadwal" hidden>
    <div class="bar"><h2 style="margin:0">Jadwal mingguan</h2><button class="pri" id="jadd">Tambah jadwal</button></div>
    <div id="jlist"></div>
   </section>
   <section id="v-bayar" hidden>
    <div class="bar"><h2 style="margin:0">Pembayaran</h2><input id="bmonth" type="month" style="width:auto"></div>
    <div id="bsum" class="sumr"></div>
    <div id="blist"></div>
   </section>
   <section id="v-laporan" hidden>
    <div class="bar"><h2 style="margin:0">Laporan pembayaran</h2><button class="pri" id="rcsv">Unduh CSV</button></div>
    <div id="rsum" class="sumr"></div>
    <div id="rlist"></div>
   </section>
  </div>
</div>

<dialog id="dlg">
  <form id="f">
    <h3 id="dname"></h3>
    <label for="dt">Tanggal</label><input id="dt" type="date" required>
    <div class="two">
      <div><label for="st">Mulai</label><input id="st" type="time"></div>
      <div><label for="en">Selesai</label><input id="en" type="time"></div>
    </div>
    <label for="sts">Status</label>
    <select id="sts"><option value="terjadwal">Terjadwal</option><option value="batal">Batal</option><option value="pindah">Pindah</option></select>
    <label for="nt">Catatan</label><input id="nt">
    <label class="chk" id="futl"><input type="checkbox" id="fut">Terapkan jam ini ke sesi berikutnya</label>
    <p id="derr" class="err" role="alert"></p>
    <div class="act"><button type="button" id="cancel">Batal</button><button class="pri">Simpan</button></div>
  </form>
</dialog>

<dialog id="sdlg">
  <form id="sform">
    <h3 id="sd-title"></h3>
    <label for="sn">Nama</label><input id="sn" required>
    <label for="sc">Kontak</label><input id="sc">
    <label for="sg">Kelas</label><input id="sg">
    <label for="sf">Paket</label><select id="sf"></select>
    <label for="sx">Catatan</label><input id="sx">
    <label class="chk"><input type="checkbox" id="sa">Siswa aktif (sesi dibuat otomatis)</label>
    <p id="serr" class="err" role="alert"></p>
    <div class="act"><button type="button" id="scancel">Batal</button><button class="pri">Simpan</button></div>
    <div id="sdel" hidden>
      <h2>Hapus siswa</h2>
      <p id="sdinfo" style="font-size:.9rem;margin:.2rem 0"></p>
      <div id="sdform" hidden>
        <label for="sdname">Ketik nama siswa untuk konfirmasi</label>
        <input id="sdname" autocomplete="off">
        <button type="button" id="sdbtn" class="danger" style="margin-top:.7rem" disabled>Hapus permanen</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="jdlg">
  <form id="jform">
    <h3 id="jd-title"></h3>
    <label for="jsd">Siswa</label><select id="jsd" required></select>
    <label for="jreg">Tanggal daftar</label><input id="jreg" type="date" required>
    <label for="jsub">Mata pelajaran</label><select id="jsub" required></select>
    <label for="jday">Hari</label>
    <select id="jday"><option value="1">Senin</option><option value="2">Selasa</option><option value="3">Rabu</option><option value="4">Kamis</option><option value="5">Jumat</option><option value="6">Sabtu</option><option value="7">Minggu</option></select>
    <div class="two">
      <div><label for="jst">Mulai</label><input id="jst" type="time"></div>
      <div><label for="jen">Selesai</label><input id="jen" type="time"></div>
    </div>
    <label for="jloc">Lokasi Les</label><select id="jloc" required></select>
    <label class="chk"><input type="checkbox" id="jact">Jadwal aktif (sesi dibuat otomatis)</label>
    <p id="jhint" style="font-size:.85rem;color:var(--mute)" hidden>Sesi mendatang yang belum pernah kamu ubah manual akan dibuat ulang sesuai jadwal ini.</p>
    <p id="jerr" class="err" role="alert"></p>
    <div class="act"><button type="button" id="jcancel">Batal</button><button class="pri">Simpan</button></div>
  </form>
</dialog>

<dialog id="bdlg">
  <form id="bform">
    <h3 id="bd-title"></h3>
    <p id="binfo" style="margin:0;color:var(--mute)"></p>
    <label for="bamt">Jumlah dibayar (Rp)</label><input id="bamt" type="number" min="1" step="1000" inputmode="numeric" required>
    <label for="bdate">Tanggal bayar</label><input id="bdate" type="date" required>
    <label for="bnote">Catatan</label><input id="bnote">
    <p id="berr" class="err" role="alert"></p>
    <div class="act"><button type="button" id="bcancel">Tutup</button><button class="pri">Catat pembayaran</button></div>
    <div id="bhist"></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/sessions.js"></script>
<script src="js/students.js"></script>
<script src="js/schedules.js"></script>
<script src="js/payments.js"></script>
<script src="js/report.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
